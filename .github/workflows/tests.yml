name: tests
on:
  push:
    branches: [main]
    tags: ['*']
  pull_request:
permissions:
  contents: read
jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: pip install pytest ruff
      - name: Lint (files listed in ruff.toml)
        run: ruff check
      - name: Install bubblewrap (sandbox tests; they skip where user namespaces are unavailable)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq bubblewrap
      - name: Unit tests (CPU only, no network, no model)
        run: python3 -m pytest -q
