name: secrets
on:
  push:
    branches: [main]
    tags: ['*']
  pull_request:
permissions:
  contents: read
jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Install gitleaks (sha256-verified)
        run: |
          curl -sSLo gitleaks.tgz https://github.com/gitleaks/gitleaks/releases/download/v8.21.2/gitleaks_8.21.2_linux_x64.tar.gz
          echo "5bc41815076e6ed6ef8fbecc9d9b75bcae31f39029ceb55da08086315316e3ba  gitleaks.tgz" | sha256sum -c -
          tar -xzf gitleaks.tgz gitleaks
          sudo mv gitleaks /usr/local/bin/
          rm gitleaks.tgz
      - name: Scan full history
        run: gitleaks git --config .gitleaks.toml --redact --no-banner -v .
      - name: Repo-specific checks (home paths, emails, instance ids, raw model output, gz contents, private device material)
        run: python3 tools/scan_public.py
